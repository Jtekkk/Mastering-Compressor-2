name: Release

# Tag a commit `vX.Y.Z` to cut a release: builds all three platforms, packages
# the plugin bundles, and publishes a GitHub Release with the zips attached.
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  verify-version:
    name: Verify tag matches project version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare tag to CMakeLists.txt project version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CMAKE_VERSION=$(grep -oP '(?<=VERSION )[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | head -n1)
          echo "Tag version:   $TAG_VERSION"
          echo "CMake version: $CMAKE_VERSION"
          if [ "$TAG_VERSION" != "$CMAKE_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match project(... VERSION $CMAKE_VERSION ...) in CMakeLists.txt. Bump the CMakeLists.txt version (or retag) so they match."
            exit 1
          fi

  build:
    name: Build
    needs: verify-version
    uses: ./.github/workflows/build.yml

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: MC2-Linux
          path: artifacts/Linux

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: MC2-macOS
          path: artifacts/macOS

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: MC2-Windows
          path: artifacts/Windows

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: MC2-Windows-Installer
          path: artifacts/WindowsInstaller

      - name: Package release archives
        run: |
          mkdir -p dist
          ( cd artifacts/Linux   && zip -r "${GITHUB_WORKSPACE}/dist/MC2-${GITHUB_REF_NAME}-Linux.zip"   . )
          ( cd artifacts/macOS   && zip -r -y "${GITHUB_WORKSPACE}/dist/MC2-${GITHUB_REF_NAME}-macOS.zip" . )
          ( cd artifacts/Windows && zip -r "${GITHUB_WORKSPACE}/dist/MC2-${GITHUB_REF_NAME}-Windows.zip" . )
          cp artifacts/WindowsInstaller/*.exe dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: MC-2 ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.exe
